<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        height: 100vh;
        background-color: #212121;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box{
        height: 100px;
        width: 100px;
        border: 2px solid red;
        color: aliceblue;
    }

    @media screen and (max-width : 500px) {
        .box{
            height: 200px;
            width: 200px;
            background-color: aqua;
        }
    }
</style>
<body>
    <div class="box">Css Media query</div>
</body>

</html>
